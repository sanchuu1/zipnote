<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact: ZipNote</title>
<meta name="description" content="Ask ZipNote about a product, a price or an order.">
<meta name="theme-color" content="#F4F3F4">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&amp;display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html"><img src="img/logo.png" width="915" height="174" alt="ZipNote home"></a>
    <nav aria-label="Main"><ul class="nav"><li><a href="index.html">Home</a></li><li><a href="products.html">Products</a></li><li><a href="about.html">About</a></li><li><a href="contact.html" aria-current="page">Contact</a></li></ul></nav>
  </div>
</header>
<main id="main">

<div class="wrap">
  <div class="page-head">
    <h1>Contact</h1>
  </div>
  <div class="contact">
    <div>
      <p class="lead">Ask about a product, a price or an order. Tell us which product you mean and we'll reply to the email address you give.</p>
      <dl class="details" id="details"></dl>
    </div>
    <form id="enquiry" novalidate>
      <div><label for="name">Your name</label><input id="name" name="name" autocomplete="name" required></div>
      <div><label for="email">Your email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
      <div><label for="topic">Product</label>
        <select id="topic" name="topic"><option value="">Not about a specific product</option><option>Cookie and Chocolate Erasers</option><option>Pizza Eraser</option><option>Basket Erasers</option><option>Floating Pen</option><option>Car and Metal Sharpeners</option><option>Chocolate Notebook Diary</option><option>Colouring Book</option><option>Spinning Toy</option><option>Projector Camera</option><option>Kaleidoscope</option><option>Cube Keychains</option><option>Fidget Ball</option><option>Chocolate Diary</option><option>Bath Bomb</option></select></div>
      <div><label for="message">Message</label><textarea id="message" name="message" required></textarea></div>
      <div><button class="btn" type="submit">Send message</button></div>
      <p class="status" id="status" role="status"></p>
    </form>
  </div>
</div>
</main>
<footer class="site-footer">
  <div class="wrap">
    <a class="brand" href="index.html"><img src="img/logo.png" width="915" height="174" alt="ZipNote home"></a>
    <ul class="foot-nav"><li><a href="index.html">Home</a></li><li><a href="products.html">Products</a></li><li><a href="about.html">About</a></li><li><a href="contact.html">Contact</a></li></ul>
    <p class="foot-note">Prices are MRP in Indian rupees, as listed for each product.</p>
  </div>
</footer>
<script src="js/site.js"></script>
</body>
</html>
